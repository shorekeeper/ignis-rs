[package]
name = "ignis"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Vulkan queue orchestration, memory management, and GPU debugging toolkit built on ash"
license = "i dont give a fuck license"
keywords = ["vulkan", "graphics", "async", "raytracing", "gpu"]
categories = ["graphics", "rendering"]

[dependencies]
ash = "0.38"

[features]
default = []
swapchain = []
slab-allocator = []
interop = []
tracking = []
descriptors = []
debug-tools = []
live-link = []
debug-window = ["swapchain", "debug-tools"]
full = ["swapchain", "slab-allocator", "interop", "tracking", "descriptors", "debug-tools", "debug-window", "live-link"]

[[example]]
name = "smoke_test"
path = "examples/smoke_test.rs"

[[example]]
name = "smoke_test_advanced"
path = "examples/smoke_test_advanced.rs"

[[example]]
name = "window_frame_graph"
path = "examples/window_frame_graph.rs"

[[example]]
name = "trigger_validation"
path = "examples/trigger_validation.rs"

[[example]]
name = "animated_window"
path = "examples/animated_window.rs"

[[example]]
name = "vl_pipeline_showcase"
path = "examples/vl_pipeline_showcase.rs"

[[example]]
name = "alloc_profiler"
path = "examples/alloc_profiler.rs"

